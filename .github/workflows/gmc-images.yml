name: Preserve clean GMC product images
on:
  push:
    branches: [main]
    paths:
      - 'almighty-tools-gmc-*.xml'
      - scripts/apply_gmc_image_overrides.py
      - scripts/gmc-image-overrides.json
      - scripts/enrich_gmc_screwdriver_descriptions.py
      - scripts/apply_screwdriver_voltage_confirmation.py
      - scripts/apply_screwdriver_bit_profiles.py
      - .github/workflows/gmc-images.yml
  workflow_run:
    workflows: [Preserve AU NZ campaign feed identities, Refresh US Christmas gift feed]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gmc-clean-product-images
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Keep image corrections after canonical and derived feed updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            python scripts/apply_gmc_image_overrides.py
            python scripts/apply_screwdriver_voltage_confirmation.py
            python scripts/apply_screwdriver_bit_profiles.py
            python scripts/enrich_gmc_screwdriver_descriptions.py
            git add 'almighty-tools-gmc-*.xml'
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Restore verified product images and screwdriver description details'
            if git push origin HEAD:main; then exit 0; fi
          done
          echo 'Unable to publish image corrections after three attempts' >&2
          exit 1
