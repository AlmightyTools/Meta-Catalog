name: Refresh Axon US catalog
on:
  push:
    branches: [main]
    paths:
      - almighty-tools-gmc-us.xml
      - scripts/build_axon_feed.py
      - .github/workflows/axon-feed.yml
  schedule:
    - cron: '15 17 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: axon-us-catalog
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==13.0.0'
      - run: python scripts/test_axon_feed.py
      - run: python scripts/build_axon_feed.py
      - name: Publish only Axon outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add almighty-tools-axon-us.csv scripts/axon-image-cache.json images/axon/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh Axon US catalog from owned US feed'
          git pull --rebase origin main
          git push origin HEAD:main
