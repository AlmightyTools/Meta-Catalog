name: Refresh German product feeds
on:
  push:
    branches: [main]
    paths:
      - scripts/prepare_german_feeds.py
      - scripts/refresh_german_feeds.py
      - scripts/test_prepare_german_feeds.py
      - .github/workflows/german-feed.yml
  schedule:
    - cron: '12 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: german-product-feeds
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify bounded publication safety
        run: python scripts/test_feed_publication.py
      - name: Refresh German sources from production
        run: python scripts/publish_generated_feed.py german
