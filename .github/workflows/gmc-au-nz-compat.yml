name: Preserve AU NZ campaign feed identities
on:
  push:
    branches: [main]
    paths:
      - almighty-tools-gmc-au.xml
      - almighty-tools-gmc-nz.xml
      - scripts/build_gmc_au_nz_compat.py
      - .github/workflows/gmc-au-nz-compat.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gmc-au-nz-campaign-compatibility
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/build_gmc_au_nz_compat.py
      - name: Publish only AU NZ compatibility outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add almighty-tools-gmc-au-nz-au-compat.xml almighty-tools-gmc-au-nz-nz-compat.xml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh AU NZ campaign compatibility feeds'
          git pull --rebase origin main
          git push origin HEAD:main
