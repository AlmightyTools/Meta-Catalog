name: Refresh ChatGPT all-market catalog
on:
  push:
    branches: [main]
    paths:
      - scripts/publish_generated_feed.py
      - scripts/test_feed_publication.py
      - scripts/feed_public_json.py
      - 'scripts/*chatgpt*'
      - '.github/workflows/chatgpt-feed.yml'
  workflow_run:
    workflows: [Preserve clean GMC product images]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chatgpt-all-market-feed
  cancel-in-progress: true
jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Coalesce a source batch; a newer run safely supersedes this waiting run.
      - name: Wait for the source batch to settle
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: sleep 15
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify publication safety and bounded retries
        run: python scripts/test_feed_publication.py
      - name: Generate and publish from the latest source snapshot
        run: python scripts/publish_generated_feed.py chatgpt
