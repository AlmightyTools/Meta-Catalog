name: Refresh ChatGPT all-market catalog
on:
  push:
    branches: [main]
    paths:
      - 'almighty-tools-gmc-??.xml'
      - 'scripts/*chatgpt*'
      - '.github/workflows/chatgpt-feed.yml'
  workflow_run:
    workflows: [Preserve clean GMC product images]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chatgpt-all-market-feed
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Refresh discovery catalog from canonical sources and public Shopify
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            python scripts/refresh_chatgpt_variant_options.py
            python scripts/refresh_chatgpt_qatar.py
            python scripts/build_chatgpt_feed.py
            python scripts/test_chatgpt_feed.py
            git add almighty-tools-chatgpt.csv scripts/chatgpt-variant-options.json scripts/chatgpt-qatar.xml
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Refresh ChatGPT catalog for all Shopify markets'
            if git push origin HEAD:main; then exit 0; fi
          done
          echo 'Unable to publish ChatGPT catalog after three attempts' >&2
          exit 1
