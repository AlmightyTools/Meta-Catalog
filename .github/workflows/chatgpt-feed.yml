name: Refresh ChatGPT all-market catalog
on:
  push:
    branches: [main]
    paths:
      - 'scripts/*chatgpt*'
      - '.github/workflows/chatgpt-feed.yml'
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chatgpt-all-market-feed
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify publication safety and bounded retries
        run: python scripts/test_feed_publication.py
      - name: Generate and publish from the latest source snapshot
        run: python scripts/publish_generated_feed.py chatgpt
