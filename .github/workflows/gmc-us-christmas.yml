name: Refresh US Christmas gift feed
on:
  push:
    branches: [main]
    paths:
      - scripts/publish_generated_feed.py
      - scripts/test_feed_publication.py
      - almighty-tools-gmc-us.xml
      - scripts/build_gmc_us_christmas.py
      - scripts/test_gmc_us_christmas.py
      - .github/workflows/gmc-us-christmas.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gmc-us-christmas
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Coalesce a source batch; a newer run safely supersedes this waiting run.
      - name: Wait for the source batch to settle
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: sleep 45
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify publication safety and bounded retries
        run: python scripts/test_feed_publication.py
      - name: Generate and publish from the latest source snapshot
        run: python scripts/publish_generated_feed.py christmas
