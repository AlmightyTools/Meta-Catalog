name: Refresh US Christmas gift feed
on:
  push:
    branches: [main]
    paths:
      - almighty-tools-gmc-us.xml
      - scripts/build_gmc_us_christmas.py
      - scripts/test_gmc_us_christmas.py
      - .github/workflows/gmc-us-christmas.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gmc-us-christmas
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate and publish Christmas output from latest source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            python scripts/test_gmc_us_christmas.py
            python scripts/build_gmc_us_christmas.py
            git add almighty-tools-gmc-us-dup.xml
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Refresh US Christmas gift feed from current US catalog'
            if git push origin HEAD:main; then exit 0; fi
          done
          echo 'Unable to publish after three attempts; source feeds unchanged' >&2
          exit 1
